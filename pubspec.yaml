name: tiklive_sales
description: TikLive Sales — Gestión inteligente de ventas en vivo para TikTok
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Backend — Supabase (PostgreSQL + Auth + Storage + Realtime)
  supabase_flutter: ^2.5.2

  # HTTP client
  dio: ^5.4.3
  http: ^1.2.1

  # Voice Recording (Android, iOS, Web, macOS, Windows)
  record: ^5.1.1
  just_audio: ^0.9.40
  permission_handler: ^11.3.1
  audio_waveforms: ^1.0.5

  # UI & Charts
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # Data Export
  excel: ^4.0.3
  pdf: ^3.10.8
  csv: ^6.0.0
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  open_filex: ^4.5.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  connectivity_plus: ^6.0.3
  flutter_dotenv: ^5.1.0
  logger: ^2.4.0

  # QR / Barcode
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Notifications
  flutter_local_notifications: ^17.2.2

  # WebSocket / Realtime TikTok bridge
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
